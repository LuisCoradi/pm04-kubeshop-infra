name: "3. Desativar ambiente (destroy)"

# Remove VMs, rede, IP elástico, volume de dados e perfis IAM do ambiente.
# Antes, faz um backup final do MongoDB no S3. O bucket (state + backups)
# permanece e é listado no resumo, junto com o que continua gerando custo.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desativar
        type: choice
        options: [dev, homolog, prod]
        default: dev
      confirm:
        description: "Digite DESTRUIR <ambiente> (ex.: DESTRUIR dev)"
        type: string
        required: true
      final_backup:
        description: Fazer backup final do MongoDB antes de destruir
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kubeshop-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TERRAFORM_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Desativar ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Conferir a confirmação
        env:
          CONFIRM: ${{ inputs.confirm }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "DESTRUIR ${ENVIRONMENT}" ]; then
            echo "::error::Confirmação incorreta. Digite exatamente: DESTRUIR ${ENVIRONMENT}"
            exit 1
          fi

      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bucket do Terraform State
        id: backend
        run: bash scripts/bootstrap-backend.sh

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Chave pública SSH (exigida pelas variáveis do Terraform)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          pub="$(bash scripts/setup-ssh.sh public)"
          echo "TF_VAR_ssh_public_key=${pub}" >>"$GITHUB_ENV"

      - name: terraform init e leitura do ambiente
        id: state
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUCKET: ${{ steps.backend.outputs.bucket }}
        run: |
          bash scripts/tf-init.sh "$ENVIRONMENT" "$BUCKET"
          terraform -chdir=terraform output -json | jq -c 'map_values(.value)' >tf-outputs.json
          if [ "$(jq length tf-outputs.json)" -gt 0 ]; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            {
              echo "APP_IP=$(jq -r .app_public_ip tf-outputs.json)"
              echo "APP_SG=$(jq -r .app_security_group_id tf-outputs.json)"
            } >>"$GITHUB_ENV"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Nenhum recurso ativo no ambiente ${ENVIRONMENT}."
          fi

      - name: Instalar Python
        if: ${{ inputs.final_backup && steps.state.outputs.exists == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Backup final do MongoDB
        if: ${{ inputs.final_backup && steps.state.outputs.exists == 'true' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          pip install -r ansible/requirements.txt
          bash scripts/setup-ssh.sh client
          bash scripts/preparar-ansible.sh tf-outputs.json
          bash scripts/runner-ssh.sh open "$APP_SG" "$APP_IP"
          cd ansible && ansible-playbook ops-backup.yml -e @infra-vars.json

      - name: Fechar SSH temporário
        if: ${{ always() && env.APP_SG != '' }}
        run: bash scripts/runner-ssh.sh close "$APP_SG"

      - name: terraform plan -destroy
        working-directory: terraform
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUCKET: ${{ steps.backend.outputs.bucket }}
        run: |
          jq -n --arg environment "$ENVIRONMENT" --arg aws_region "$AWS_REGION" \
            --arg backup_bucket "$BUCKET" '$ARGS.named' >pipeline.auto.tfvars.json
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan | tee plan.txt
          {
            echo "### Recursos removidos (${ENVIRONMENT})"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt | head -80
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: terraform apply (destroy)
        working-directory: terraform
        run: terraform apply -input=false -no-color destroy.tfplan

      - name: O que continua existindo e gerando custo
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUCKET: ${{ steps.backend.outputs.bucket }}
        run: |
          backups="$(aws s3 ls "s3://${BUCKET}/backups/${ENVIRONMENT}/" --human-readable --summarize || true)"
          echo "$backups"
          {
            echo "### Continua existindo após a desativação"
            echo "- Bucket \`${BUCKET}\`: Terraform State (versionado) e backups do MongoDB (retenção de 14 dias)."
            echo '```'
            echo "$backups" | tail -n 12
            echo '```'
            echo "- Imagens no GitHub Container Registry (fora da AWS)."
            echo "- Domínio, se configurado (renovação anual no registrador)."
            echo
            echo "Para recriar o ambiente: workflow **1. Deploy**. Para restaurar os dados: **2. Operações** > restore-replace."
          } >>"$GITHUB_STEP_SUMMARY"

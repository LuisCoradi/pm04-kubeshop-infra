name: "2. Operações - saúde, logs, reinício, backup e restauração"

# Rotinas do dia a dia do ambiente, sem acesso manual aos servidores.
# Ações que apagam ou substituem dados exigem confirmação digitada.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [dev, homolog, prod]
        default: dev
      operation:
        description: Rotina
        type: choice
        options:
          - status
          - logs
          - restart
          - smoke
          - isolation-check
          - backup
          - restore-verify
          - restore-replace
        default: status
      service:
        description: "Serviço (logs e restart)"
        type: choice
        options: [all, api, frontend, caddy, mongodb]
        default: all
      backup_ref:
        description: "Backup a restaurar: latest ou nome do arquivo"
        type: string
        default: latest
      confirm:
        description: "Somente restore-replace: digite RESTAURAR <ambiente>"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: kubeshop-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TERRAFORM_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"

jobs:
  operation:
    name: ${{ inputs.operation }} (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validar parâmetros
        env:
          BACKUP_REF: ${{ inputs.backup_ref }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          re='^(latest|[A-Za-z0-9._/-]+)$'
          [[ "$BACKUP_REF" =~ $re ]] || { echo "::error::backup_ref inválido"; exit 1; }
          if [ "$OPERATION" = "restore-replace" ] && [ "$CONFIRM" != "RESTAURAR ${ENVIRONMENT}" ]; then
            echo "::error::Para substituir os dados digite exatamente: RESTAURAR ${ENVIRONMENT}"
            exit 1
          fi

      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Instalar Ansible
        run: pip install -r ansible/requirements.txt

      - name: Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bucket do Terraform State
        id: backend
        run: bash scripts/bootstrap-backend.sh

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Ler o ambiente no Terraform State
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUCKET: ${{ steps.backend.outputs.bucket }}
        run: |
          bash scripts/tf-init.sh "$ENVIRONMENT" "$BUCKET" >/dev/null
          terraform -chdir=terraform output -json | jq -c 'map_values(.value)' >tf-outputs.json
          if [ "$(jq length tf-outputs.json)" -eq 0 ]; then
            echo "::error::O ambiente ${ENVIRONMENT} não existe. Rode o workflow 1. Deploy."
            exit 1
          fi
          {
            echo "APP_IP=$(jq -r .app_public_ip tf-outputs.json)"
            echo "APP_SG=$(jq -r .app_security_group_id tf-outputs.json)"
            echo "DB_PUBLIC_IP=$(jq -r .db_public_ip tf-outputs.json)"
          } >>"$GITHUB_ENV"

      - name: Teste externo de isolamento (internet -> MongoDB)
        if: ${{ inputs.operation == 'isolation-check' }}
        run: |
          fail=0
          for target in "${DB_PUBLIC_IP}:27017" "${APP_IP}:27017" "${DB_PUBLIC_IP}:22"; do
            host="${target%:*}"
            port="${target#*:}"
            if nc -z -w 5 "$host" "$port"; then
              echo "::error::${target} ACEITOU conexão pela internet"
              fail=1
            else
              echo "BLOQUEADO (esperado): ${target}"
            fi
          done
          {
            echo "### Isolamento visto da internet"
            echo "- ${DB_PUBLIC_IP}:27017 (MongoDB pelo IP público do banco): bloqueado"
            echo "- ${APP_IP}:27017 (MongoDB pelo IP da aplicação): bloqueado"
            echo "- ${DB_PUBLIC_IP}:22 (SSH direto no banco): bloqueado"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$fail"

      - name: Chave SSH e inventário
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/setup-ssh.sh client
          bash scripts/preparar-ansible.sh tf-outputs.json

      - name: Liberar SSH temporário para este runner
        run: bash scripts/runner-ssh.sh open "$APP_SG" "$APP_IP"

      - name: Executar a rotina
        working-directory: ansible
        env:
          OPERATION: ${{ inputs.operation }}
          SERVICE: ${{ inputs.service }}
          BACKUP_REF: ${{ inputs.backup_ref }}
          CONFIRM: ${{ inputs.confirm }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          case "$OPERATION" in
            status) playbook=ops-status.yml ;;
            logs) playbook=ops-logs.yml ;;
            restart) playbook=ops-restart.yml ;;
            smoke) playbook=ops-smoke.yml ;;
            isolation-check) playbook=ops-isolation.yml ;;
            backup) playbook=ops-backup.yml ;;
            restore-verify) playbook=ops-restore.yml; RESTORE_MODE=verify ;;
            restore-replace) playbook=ops-restore.yml; RESTORE_MODE=replace ;;
            *) echo "::error::Rotina desconhecida: ${OPERATION}"; exit 1 ;;
          esac
          jq -n \
            --arg service "$SERVICE" \
            --arg backup_ref "$BACKUP_REF" \
            --arg confirm "$CONFIRM" \
            --arg restore_mode "${RESTORE_MODE:-verify}" \
            '$ARGS.named' >ops-vars.json
          ansible-playbook "$playbook" -e @infra-vars.json -e @ops-vars.json

      - name: Fechar SSH temporário
        if: ${{ always() && env.APP_SG != '' }}
        run: bash scripts/runner-ssh.sh close "$APP_SG"

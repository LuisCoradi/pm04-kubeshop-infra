---
# Docker Engine do repositório oficial da Docker, instalado só se ainda não
# estiver presente. Atualizações do Docker acontecem com update_os=true.

- name: Verificar se o Docker já está instalado
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary

- name: Remover pacotes de contêiner conflitantes da distribuição
  when: not docker_binary.stat.exists
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
    lock_timeout: 600

- name: Criar diretório de chaves do APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Baixar a chave GPG do repositório do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configurar o repositório oficial do Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Instalar o Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"
    lock_timeout: 600

- name: Configurar o daemon do Docker (rotação de logs e live-restore)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar Docker

- name: Manter o Docker ativo e habilitado na inicialização
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Aplicar alterações pendentes do Docker
  ansible.builtin.meta: flush_handlers

- name: Consultar a versão do Docker
  ansible.builtin.command: docker version --format "{{ '{{' }}.Server.Version{{ '}}' }}"
  register: docker_version
  changed_when: false

- name: Informar a versão do Docker
  ansible.builtin.debug:
    msg: "Docker Engine {{ docker_version.stdout }}"

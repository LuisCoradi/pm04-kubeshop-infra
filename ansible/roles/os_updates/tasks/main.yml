---
# Verifica sempre as atualizações pendentes do SO e só aplica quando a
# pipeline recebe update_os=true. Se o kernel exigir, reinicia uma VM por vez
# (primeiro o banco, depois a aplicação).

- name: Desativar upgrades automáticos (o SO só muda pela pipeline)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Gerenciado pelo Ansible (KubeShop). Atualizações: parâmetro update_os.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "0";
    owner: root
    group: root
    mode: "0644"
  when: disable_unattended_upgrades | bool

- name: Atualizar o índice de pacotes (no máximo 1x por hora)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  changed_when: false

- name: Listar atualizações pendentes
  ansible.builtin.shell: |
    set -o pipefail
    apt list --upgradable 2>/dev/null | grep -c upgradable || true
  args:
    executable: /bin/bash
  register: os_pending
  changed_when: false

- name: Informar atualizações pendentes
  ansible.builtin.debug:
    msg: >-
      {{ os_pending.stdout | int }} pacote(s) com atualização disponível.
      update_os={{ update_os | bool }}:
      {{ 'serão aplicadas agora' if update_os | bool else 'nada será aplicado nesta execução' }}.

- name: Aplicar atualizações do sistema operacional
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    lock_timeout: 600
  register: os_upgrade
  when: update_os | bool

- name: Verificar se o sistema pede reinicialização
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  when: update_os | bool

- name: Reiniciar a VM (uma por vez)
  ansible.builtin.reboot:
    msg: "Reinicializacao apos atualizacao do SO (pipeline KubeShop)"
    reboot_timeout: 600
  throttle: 1
  when:
    - update_os | bool
    - allow_reboot | bool
    - reboot_required.stat.exists

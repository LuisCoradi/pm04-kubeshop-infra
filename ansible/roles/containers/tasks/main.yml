---
# Contêineres a partir de imagens existentes, conforme o papel de cada VM:
#   db  -> mongodb
#   app -> api, frontend e caddy (entrada pública)

- name: Validar segredos obrigatórios (GitHub Secrets)
  ansible.builtin.assert:
    that:
      - mongo_app_password | length >= 12
      - ('db' not in group_names) or (mongo_root_password | length >= 12)
    fail_msg: "Defina os secrets MONGO_ROOT_PASSWORD e MONGO_APP_PASSWORD (mínimo 12 caracteres)."
    quiet: true

- name: Criar diretórios da aplicação
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kubeshop_dir }}", mode: "0755" }
    - { path: "{{ kubeshop_dir }}/secrets", mode: "0711" }
    - { path: "{{ kubeshop_dir }}/config", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Contêineres da VM do banco
  ansible.builtin.include_tasks: db.yml
  when: "'db' in group_names"

- name: Contêineres da VM da aplicação
  ansible.builtin.include_tasks: app.yml
  when: "'app' in group_names"

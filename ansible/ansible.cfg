[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# VMs efêmeras recriadas pela pipeline: a chave de host muda a cada criação.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
show_task_path_on_failure = True
timeout = 30
forks = 5
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
